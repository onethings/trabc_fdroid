name: Release

# The Flutter SDK version used for release builds is pinned in the `with:` block
# below. F-Droid extracts that value at build time (see fdroiddata
# templates/build-flutter.yml) so the pinned version lives in this repo.
#
# This workflow is manual-only (workflow_dispatch): it just builds the split
# APKs as artifacts for verification. Publishing to GitHub Releases is still
# done locally (apksigner + manual upload).

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true

      - name: Build release APKs
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-split-per-abi
          path: build/app/outputs/flutter-apk/*-release.apk
